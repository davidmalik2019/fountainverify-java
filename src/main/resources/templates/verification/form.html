<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Fountain Verify - Verify Certificate</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef3f8;
        }

        .header {
            background: #071f3d;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #071f3d;
            text-align: center;
        }

        .card p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 25px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #1683d8;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 5px;
            background: #071f3d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1683d8;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <div class="header">

        <h1>Fountain Verify</h1>

    </div>

    <div class="container">

        <div class="card">

            <h2>Verify Certificate</h2>

            <p>
                Enter the certificate number below to verify
                the authenticity of a certificate.
            </p>

            <form action="/verify" method="get">

                <label for="certificateNumber">
                    Certificate Number
                </label>

                <input
                    type="text"
                    id="certificateNumber"
                    name="certificateNumber"
                    placeholder="e.g. FV-2026-0004"
                    required>

                <button type="submit">
                    Verify Certificate
                </button>

            </form>

            <div class="footer">

                Fountain Information Service

            </div>

        </div>

    </div>

</body>

</html>
