
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fountain Verify - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef3f8, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .login-header {
            background: #071f3d;
            color: #ffffff;
            text-align: center;
            padding: 30px 20px;
        }

        .login-header h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .login-header p {
            margin: 0;
            color: #d9e6f4;
            font-size: 14px;
        }

        .login-content {
            padding: 30px 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333333;
        }

        .form-group input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #071f3d;
        }

        .login-button {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 7px;
            background: #071f3d;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button:hover {
            background: #0d315d;
        }

        .success-message {
            background: #eaf8ef;
            border: 1px solid #a7dcb8;
            color: #137a37;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            text-align: center;
        }

        .error-message {
            background: #fff0f0;
            border: 1px solid #e3aaaa;
            color: #b42323;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            text-align: center;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #777777;
            font-size: 13px;
        }

        .register-link a {
            color: #071f3d;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .login-footer {
            text-align: center;
            background: #f7f9fb;
            border-top: 1px solid #e5e5e5;
            padding: 15px;
            color: #777777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-header">
        <h1>Fountain Verify</h1>
        <p>Registration &amp; Verification System</p>
    </div>

    <div class="login-content">

        <div th:if="${success}"
             class="success-message"
             th:text="${success}">
        </div>

        <div th:if="${error}"
             class="error-message"
             th:text="${error}">
        </div>

        <form th:action="@{/login}" method="post">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                Login
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a th:href="@{/register}">Register</a>
        </div>

    </div>

    <div class="login-footer">
        Fountain Information Service<br>
        Fountain Verify Registration System
    </div>

</div>

</body>
</html>
