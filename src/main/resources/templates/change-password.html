
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password - Fountain Verify</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .header {
            background: #071d49;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 15px;
        }

        .container {
            width: 92%;
            max-width: 550px;
            margin: 40px auto;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            color: #071d49;
            margin-bottom: 8px;
        }

        .title p {
            color: #666;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #071d49;
        }

        .button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #071d49;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background: #0d3278;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #071d49;
            text-decoration: none;
            font-weight: bold;
        }

        .note {
            margin-top: 20px;
            padding: 12px;
            background: #f4f7fb;
            border-radius: 6px;
            font-size: 13px;
            color: #666;
            text-align: center;
        }

        @media (max-width: 600px) {

            .card {
                padding: 25px 20px;
            }

        }

    </style>
</head>

<body>

    <div class="header">

        <h1>FOUNTAIN VERIFY</h1>

        <p>Change Password</p>

    </div>

    <div class="container">

        <div class="card">

            <div class="title">

                <h2>Change Password</h2>

                <p>
                    Update your Fountain Verify account password.
                </p>

            </div>
			<div th:if="${error}"
			     style="background:#ffe5e5;
			            color:#b00020;
			            padding:12px;
			            border-radius:6px;
			            margin-bottom:20px;
			            text-align:center;
			            font-weight:bold;"
			     th:text="${error}">
			</div>

			<div th:if="${success}"
			     style="background:#e5f7e5;
			            color:#176b17;
			            padding:12px;
			            border-radius:6px;
			            margin-bottom:20px;
			            text-align:center;
			            font-weight:bold;"
			     th:text="${success}">
			</div>
			<form th:action="@{/change-password}"
			      method="post">
                <div class="form-group">

                    <label for="currentPassword">
                        Current Password
                    </label>

                    <input
                        type="password"
                        id="currentPassword"
                        name="currentPassword"
                        required>

                </div>

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        required
                        minlength="6">

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        required
                        minlength="6">

                </div>

                <button
                    type="submit"
                    class="button">
                    Change Password
                </button>

            </form>

            <div class="note">
                Your password will be securely encrypted before it is stored.
            </div>

            <div class="back">

                <a href="/profile">
                    ← Back to My Profile
                </a>

            </div>

        </div>

    </div>

</body>

</html>
